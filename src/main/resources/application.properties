spring.application.name=Career Monitor

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver





spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.servlet.context-path=/api

#THESE CREDENTIALS ARE JUST FOR DEVELOPMENT PURPOSE
spring.security.user.name=admin
spring.security.user.password=admin

# Wipes all tables and recreates them fresh every time the app starts

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/career_monitor_realm
